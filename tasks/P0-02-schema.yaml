id: P0-02
title: Local Supabase stack, base schema, RLS helpers and policies, RLS tests
phase: 0
status: approved
approved_by: autopilot (D-006)
approved_at: 2026-11-01
depends_on: [P0-01]

objective: >
  A local Supabase stack with the base account tables (profiles, trainers, trainer_clients),
  row-level security enabled on every table with the §6 helper functions and policies, an
  updated_at trigger, a seed of one admin, two trainers and two clients, regenerated TypeScript
  types, and an RLS test suite that proves cross-trainer and cross-client isolation.

context:
  - docs/architecture.md   # §2 DB workflow, folder structure, conventions
  - docs/data-model.md     # §5 Accounts tables
  - docs/security.md        # §6 RLS helpers, policies, storage, RLS tests
  - docs/commands.md        # database + app scripts

scope:
  - supabase/config.toml, supabase/.gitignore (from `supabase init`)
  - supabase/migrations/*.sql  # new migrations only
  - supabase/seed.sql
  - src/lib/supabase/types.ts  # generated by `pnpm db:types` — never hand-edited
  - src/lib/supabase/server.ts, browser.ts, admin.ts  # the three @supabase/ssr clients
  - tests/rls/**               # the RLS test suite
  - package.json               # add `supabase` + `@supabase/ssr`/`@supabase/supabase-js` (pre-approved); real `test:rls` script
  - vitest.config.ts           # include tests/rls if run through vitest

constraints:
  - Enable row level security on every table created here (profiles, trainers, trainer_clients); check-architecture.mjs enforces it.
  - Never edit a committed migration — add a new migration file.
  - Never hand-edit src/lib/supabase/types.ts — regenerate with `pnpm db:types`.
  - The service/secret key is read only in src/lib/supabase/admin.ts, server-only code and tests; never in client code or with a NEXT_PUBLIC_ prefix.
  - Only the base account tables in this task; feature tables (forms, training, commerce, …) come with their feature tasks.
  - Only pre-approved packages (supabase CLI, @supabase/ssr, @supabase/supabase-js). No auth UI, middleware or design-system code (P0-03/P0-04).
  - Local stack only. Never link, push or change the remote Supabase project.

acceptance:
  - id: A1
    claim: Migrations create profiles, trainers and trainer_clients, each with RLS enabled, plus security-definer helpers is_admin() and is_trainer_of(client uuid) and an updated_at trigger on mutable tables.
    evidence: command
    how: "node scripts/check-architecture.mjs"   # rls-missing rule passes for all three tables
  - id: A2
    claim: A fresh `supabase db reset` applies all migrations and the seed with no error, creating one admin, two trainers and two clients with trainer_clients links.
    evidence: verifier   # orchestrator runs `pnpm exec supabase db reset`; output shows success and seeded rows
  - id: A3
    claim: Generated types are regenerated into src/lib/supabase/types.ts and the project still typechecks.
    evidence: .harness/last-verify.json (step typecheck, result pass)
    how: "node scripts/verify.mjs"
  - id: A4
    claim: RLS tests prove isolation — trainer A cannot read or write trainer B's clients; a client cannot read another client's data or any coach notes; an anonymous user cannot read profiles/trainers private rows.
    evidence: .harness/last-verify.json (step test:rls, result pass)
    how: "node scripts/verify.mjs --full"
  - id: A5
    claim: The test:rls package.json script runs the real suite against the local stack (no longer the P0-01 placeholder).
    evidence: verifier

approval_required:
  - Any package beyond the pre-approved Supabase client/CLI set
  - Any remote Supabase action (link, db push, secrets) — not needed for this task

out_of_scope:
  - Auth flows, onboarding, middleware, role routing (P0-04)
  - Profile-on-signup trigger (handle_new_user) — belongs with auth (P0-04)
  - Storage buckets and the public_trainer_profiles view (created with the features that need them)
  - Any feature-domain tables

budget:
  max_attempts_per_failure: 3
  max_files_changed: 30

notes: >
  Supabase CLI is not on PATH; install it as a dev dependency (`pnpm add -D supabase`, pre-approved) and run
  via pnpm/`pnpm exec` — scripts run through `pnpm run` get node_modules/.bin on PATH, so the bare `supabase`
  in db:types resolves. Docker Desktop is running (verified 2026-11-01). Flow: `pnpm exec supabase init`
  (non-interactive), add migrations, write seed.sql, `pnpm exec supabase start`, `pnpm exec supabase db reset`,
  `pnpm db:types`. RLS test harness: a Vitest suite in tests/rls/ using @supabase/supabase-js against the local
  stack (anon key + sign-in as seeded users for per-role JWTs; service-role for setup); assert allowed reads/writes
  succeed and cross-tenant ones return no rows / error. Point the real `test:rls` script at it.

  ## Schema lane
  This whole task is schema-lane work done by the orchestrator in the main checkout: migrations, RLS policies,
  seed, `supabase db reset`, `pnpm db:types`, RLS tests. No parallel builders.
