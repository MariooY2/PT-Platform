name: CI

# The same gate the agent runs locally (docs/commands.md: node scripts/verify.mjs --full),
# independent of the agent. No GitHub secrets are needed: the job spins up a fresh local Supabase
# stack and uses its demo keys via `supabase status`.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify --full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the full verify gate
        run: node scripts/verify.mjs --full
